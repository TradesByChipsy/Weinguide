<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cata">
<title>Cata · Mein Weinkeller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<!--
THESIS: Two questions, not one list. The app opens on the question you actually have at the rack — "what goes with dinner?" or "what do I still have?" — and answers it with a dense, scannable register. Refuses the card-feed skeleton (chips → stat tiles → rounded shadow cards) that every generic app ships.
OWN-WORLD: White ground, cream second surface (#F7F3E8), one saturated wine magenta (#A81243) as the only accent. Display is Cormorant Garamond Bold Italic, set very large; body is the plain system stack. Flat: hairlines, 2-4px radii, no shadows. Wine type lives as a 3px stripe at the row's left edge — solid when the bottle is in the cellar, hairline when it is not.
STORY: Pick the dish or open the cellar; read 15+ wines at a glance; tap one to open its note in place.
FIRST VIEWPORT: mode switch, the question set huge in italic serif, the dish row or scope toggle, then rows starting above the fold.
FORM: dense register + editorial display type, derived from the user's own reference (enolisa.com) — mobile-first, desktop is a widened variant.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
-->
<style>
:root{
  --paper:#ffffff;
  --cream:#f7f3e8;
  --cream-deep:#efe9d8;
  --ink:#1a1418;
  --ink2:#6b6560;
  --faint:#9a938c;
  --line:#e6e0d4;
  --line-strong:#d5cdbd;
  --accent:#a81243;
  --accent-soft:#fbeaf0;
  --w-red:#8e2036; --w-white:#c9a227; --w-rose:#e08a7d; --w-natur:#6b8e4e; --w-sweet:#b5651d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);background:var(--paper);
  min-height:100vh;-webkit-font-smoothing:antialiased;
  font-size:16px;line-height:1.45;
  padding-bottom:calc(env(safe-area-inset-bottom) + 48px);
}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
button,input,select,textarea{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- brand + mode switch ---------- */
.brand{display:flex;align-items:baseline;gap:8px;padding:20px 0 0;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.brand b{color:var(--accent);font-weight:700;letter-spacing:.18em}

.modes{display:flex;gap:0;margin:16px 0 0;border-bottom:1.5px solid var(--line-strong)}
.modes button{flex:1;background:none;border:none;padding:11px 4px 10px;font-size:14px;font-weight:600;color:var(--faint);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;transition:color .15s}
.modes button.on{color:var(--accent);border-bottom-color:var(--accent)}

/* ---------- the question ---------- */
h1{
  font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:700;
  font-size:clamp(38px,12vw,54px);line-height:.96;letter-spacing:-.01em;
  margin:18px 0 0;color:var(--ink);
}
h1 em{font-style:italic;color:var(--accent)}
.lede{margin:8px 0 0;font-size:13px;color:var(--ink2)}

/* ---------- dish row ---------- */
.dishes{display:flex;gap:7px;overflow-x:auto;margin:20px -18px 0;padding:2px 18px 6px;scrollbar-width:none}
.dishes::-webkit-scrollbar{display:none}
.dish{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;width:62px;padding:9px 4px;border:1px solid var(--line);border-radius:3px;background:var(--paper);cursor:pointer}
.dish .emo{font-size:21px;line-height:1}
.dish .lbl{font-size:10.5px;color:var(--ink2);text-align:center;line-height:1.15;font-weight:500}
.dish.on{background:var(--accent);border-color:var(--accent)}
.dish.on .lbl{color:#fff}

/* ---------- scope + filters ---------- */
.scope{display:flex;margin:14px 0 0;border:1px solid var(--line-strong);border-radius:3px;overflow:hidden}
.scope button{flex:1;background:var(--paper);border:none;padding:9px 6px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.scope button+button{border-left:1px solid var(--line-strong)}
.scope button.on{background:var(--accent);color:#fff}

.searchrow{display:flex;align-items:center;gap:8px;margin:11px 0 0;border-bottom:1.5px solid var(--line-strong);padding-bottom:7px}
.searchrow .ic{color:var(--faint);font-size:15px;line-height:1}
.searchrow input{flex:1;background:none;border:none;outline:none;padding:3px 0;font-size:16px;color:var(--ink)}
.searchrow input::placeholder{color:var(--faint)}

.typefilters{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0 0}
.tf{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:5px 10px;font-size:12.5px;font-weight:500;color:var(--ink2);cursor:pointer}
.tf .sw{width:9px;height:9px;border-radius:1px;flex:none}
.tf.on{background:var(--ink);border-color:var(--ink);color:#fff}

.metarow{display:flex;align-items:center;gap:10px;margin:12px 0 0;font-size:11.5px;color:var(--faint)}
.metarow select{margin-left:auto;background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:5px 7px;font-size:12px;color:var(--ink2);outline:none}
.metarow .reset{background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;text-decoration:underline;padding:0}

/* ---------- group heading ---------- */
.ghead{display:flex;align-items:baseline;gap:8px;margin:18px 0 0;padding-bottom:5px;border-bottom:1.5px solid var(--ink)}
.ghead .gn{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.ghead .gc{margin-left:auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}

/* ---------- dense rows ---------- */
.row{border-bottom:1px solid var(--line)}
.rowhead{display:flex;align-items:stretch;gap:10px;width:100%;background:none;border:none;padding:9px 0;text-align:left;cursor:pointer;color:inherit}
.stripe{width:3px;flex:none;border-radius:2px;background:var(--faint)}
.row.t-red .stripe{background:var(--w-red)}
.row.t-white .stripe{background:var(--w-white)}
.row.t-rose .stripe{background:var(--w-rose)}
.row.t-natur .stripe{background:var(--w-natur)}
.row.t-sweet .stripe{background:var(--w-sweet)}
.row:not(.owned) .stripe{background:none;box-shadow:inset 0 0 0 1px currentColor;opacity:.3}
.row:not(.owned).t-red .stripe{color:var(--w-red)}
.row:not(.owned).t-white .stripe{color:var(--w-white)}
.row:not(.owned).t-rose .stripe{color:var(--w-rose)}
.row:not(.owned).t-natur .stripe{color:var(--w-natur)}
.row:not(.owned).t-sweet .stripe{color:var(--w-sweet)}
.rmain{flex:1;min-width:0}
.rname{display:block;font-size:14.5px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsub{display:block;font-size:11.5px;color:var(--ink2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rright{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:3px}
.rprice{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.rdots{display:flex;gap:2px}
.rdots i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:block}
.rscore{font-size:10.5px;color:var(--accent);font-weight:700}
.row.open .rowhead{background:var(--cream)}

/* ---------- inline detail ---------- */
.rdetail{display:none;padding:2px 0 16px 13px}
.row.open .rdetail{display:block}
.desc{font-size:13.5px;line-height:1.6;color:var(--ink2)}
.pairs{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.plab{font-size:11px;color:var(--ink2);background:var(--cream);border-radius:2px;padding:3px 7px}
.dmeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.dtag{font-size:10.5px;color:var(--ink2);border:1px solid var(--line);border-radius:2px;padding:2px 7px}
.dtag.score{color:#fff;background:var(--accent);border-color:var(--accent);font-weight:600}
.rate{display:flex;align-items:center;gap:6px;margin-top:14px}
.rate .stars{display:flex;gap:4px}
.rate .st{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);background:none;cursor:pointer;padding:0}
.rate .st.on{background:var(--accent);border-color:var(--accent)}
.rlabel{font-size:11.5px;color:var(--faint)}
.rlabel .loc{color:var(--accent)}
.revert{background:none;border:none;color:var(--accent);font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0;margin-left:7px}
.note-lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:14px 0 5px}
.note{width:100%;min-height:56px;resize:vertical;background:var(--cream);border:1px solid var(--line);border-radius:3px;padding:9px 10px;font-size:14px;color:var(--ink);outline:none}
.note:focus{border-color:var(--accent);background:var(--paper)}

/* ---------- misc ---------- */
.hint{margin:24px 0 0;padding:14px 16px;background:var(--cream);border-radius:3px;font-size:13px;color:var(--ink2);line-height:1.6}
.hint b{color:var(--ink)}
.empty{padding:40px 0;text-align:center;color:var(--ink2);font-size:14px;line-height:1.7}
.empty b{color:var(--ink)}
.foot{margin:34px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);line-height:1.7}
.foot code{font-size:10.5px}
.err{margin:36px 0;padding:18px;border:1px solid var(--line-strong);border-radius:3px;font-size:14px;line-height:1.6}
.err b{color:var(--accent)}
.view{display:none}
.view.on{display:block}

@media (min-width:620px){
  .wrap{max-width:760px}
  .rname{font-size:15.5px}
  .rsub{font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><b>Cata</b><span id="eyebrow"></span></div>

  <nav class="modes">
    <button id="mFood" class="on">Zum Essen</button>
    <button id="mCellar">Im Keller</button>
  </nav>

  <!-- ============ MODE 1: food ============ -->
  <section class="view on" id="foodView">
    <h1>Wozu passt<br><em>es heute?</em></h1>
    <div class="lede">Gericht antippen — du siehst zuerst, was du selbst da hast.</div>
    <div class="dishes" id="dishes"></div>
    <div id="foodResults"></div>
  </section>

  <!-- ============ MODE 2: cellar ============ -->
  <section class="view" id="cellarView">
    <h1>Was hab<br><em>ich da?</em></h1>
    <div class="scope">
      <button id="scopeMine" class="on">Nur meine</button>
      <button id="scopeAll">Alle</button>
    </div>
    <div class="searchrow"><span class="ic">⌕</span><input id="search" type="search" placeholder="Wein, Bodega oder Traube…" autocomplete="off"></div>
    <div class="typefilters" id="typeFilters"></div>
    <div class="metarow">
      <span id="count"></span>
      <button class="reset" id="reset">zurücksetzen</button>
      <select id="sort">
        <option value="region">nach Region</option>
        <option value="myrating">meine Bewertung</option>
        <option value="score">Kritiker-Punkte</option>
        <option value="price">Preis aufsteigend</option>
        <option value="name">Name A–Z</option>
      </select>
    </div>
    <div id="cellarResults"></div>
  </section>

  <div class="foot" id="foot"></div>
</div>

<script>
const DISHES=[["🍷","Solo"],["🍕","Pizza"],["🍝","Pasta"],["🍖","Grill"],["🥘","Paella"],["🦐","Fisch"],["🧀","Käse"]];
const FOODLABEL={"🍷":"Solo / leicht","🍕":"Pizza","🍝":"Pasta","🍖":"Grill / Asado","🥘":"Paella (Fleisch)","🦐":"Fisch & Meer","🧀":"Käse","🥗":"Gemüse / leicht","🍮":"Dessert"};
const TYPES=[["red","Rot"],["white","Weiß"],["rose","Rosé"],["natur","Natur"],["sweet","Süß"]];
const TYPE_VAR={red:"--w-red",white:"--w-white",rose:"--w-rose",natur:"--w-natur",sweet:"--w-sweet"};

let DOC=null,WINES=[],REGIONS={},regionColor={};
let mode="food",activeDish=null;
let scope="mine",activeType=new Set(),query="",sortMode="region";
let openIds=new Set();

// ---- personal overrides (per device) layered over the maintained values ----
const local={
  get:id=>{try{return JSON.parse(localStorage.getItem("wein_"+id)||"{}")}catch(e){return{}}},
  set:(id,v)=>{try{localStorage.setItem("wein_"+id,JSON.stringify(v))}catch(e){}}
};
const effRating=w=>{const l=local.get(w.id);return l.rating!=null?l.rating:(w.rating||0)};
const effNote=w=>{const l=local.get(w.id);return l.note!=null?l.note:(w.note||"")};
const isLocal=w=>{const l=local.get(w.id);return l.rating!=null||l.note!=null};

const CERAMIC=["#C08A2E","#2E7D74","#BC5237","#3E6DA6","#8A6D3B","#9C5A8C","#5A8C57","#B07A2A","#4C7E8A","#A84B3A"];
function hashHue(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function colorFor(k){
  if(regionColor[k])return regionColor[k];
  const m=REGIONS[k];
  return regionColor[k]=(m&&m.color)?m.color:CERAMIC[hashHue(k)%CERAMIC.length];
}
const regionName=k=>(REGIONS[k]&&REGIONS[k].name)||k;
const regionDO=k=>(REGIONS[k]&&REGIONS[k].do)||"";
const scoreNum=w=>{const m=(w.score||"").match(/\d{2,3}/);return m?+m[0]:0};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------------- load ----------------
fetch("wines.json?v="+Date.now())
  .then(r=>{if(!r.ok)throw 0;return r.json()})
  .then(doc=>{DOC=doc;WINES=doc.wines||[];REGIONS=doc.regions||{};boot()})
  .catch(()=>{
    document.querySelector(".wrap").insertAdjacentHTML("beforeend",
      '<div class="err"><b>Weinliste nicht gefunden.</b><br>Die App lädt <code>wines.json</code> aus demselben Ordner. Das funktioniert über GitHub&nbsp;Pages oder einen lokalen Server — beim reinen Doppelklick auf die Datei blockiert der Browser das Laden.</div>');
  });

function boot(){
  const m=DOC.meta||{};
  document.getElementById("eyebrow").textContent="· "+(m.subtitle||"España");
  document.getElementById("foot").innerHTML=
    `${m.owned||0} im Keller · ${m.total||WINES.length} Weine · Stand ${esc(m.updated||"")}<br>`+
    `Bewertungen und Notizen liegen nur auf diesem Gerät (mit „lokal" markiert). Alles andere kommt aus <code>wines.json</code>.`;

  buildDishes();buildTypeFilters();

  document.getElementById("mFood").onclick=()=>setMode("food");
  document.getElementById("mCellar").onclick=()=>setMode("cellar");
  document.getElementById("scopeMine").onclick=()=>{scope="mine";syncScope();renderCellar()};
  document.getElementById("scopeAll").onclick=()=>{scope="all";syncScope();renderCellar()};
  document.getElementById("search").oninput=e=>{query=e.target.value.toLowerCase().trim();renderCellar()};
  document.getElementById("sort").onchange=e=>{sortMode=e.target.value;renderCellar()};
  document.getElementById("reset").onclick=resetCellar;

  renderFood();renderCellar();
}

function setMode(m){
  mode=m;
  document.getElementById("mFood").classList.toggle("on",m==="food");
  document.getElementById("mCellar").classList.toggle("on",m==="cellar");
  document.getElementById("foodView").classList.toggle("on",m==="food");
  document.getElementById("cellarView").classList.toggle("on",m==="cellar");
  window.scrollTo({top:0,behavior:"smooth"});
}
function syncScope(){
  document.getElementById("scopeMine").classList.toggle("on",scope==="mine");
  document.getElementById("scopeAll").classList.toggle("on",scope==="all");
}

function buildDishes(){
  const el=document.getElementById("dishes");el.innerHTML="";
  DISHES.forEach(([emo,lbl])=>{
    const b=document.createElement("button");b.className="dish";
    b.innerHTML=`<span class="emo">${emo}</span><span class="lbl">${lbl}</span>`;
    b.onclick=()=>{
      activeDish=(activeDish===emo)?null:emo;
      [...el.children].forEach(c=>c.classList.remove("on"));
      if(activeDish)b.classList.add("on");
      renderFood();
    };
    el.appendChild(b);
  });
}
function buildTypeFilters(){
  const el=document.getElementById("typeFilters");el.innerHTML="";
  const present=new Set(WINES.map(w=>w.type));
  TYPES.filter(([k])=>present.has(k)).forEach(([k,l])=>{
    const b=document.createElement("button");b.className="tf";
    b.innerHTML=`<span class="sw" style="background:var(${TYPE_VAR[k]})"></span>${l}`;
    b.onclick=()=>{
      activeType.has(k)?activeType.delete(k):activeType.add(k);
      b.classList.toggle("on",activeType.has(k));
      renderCellar();
    };
    el.appendChild(b);
  });
}
function resetCellar(){
  activeType.clear();query="";sortMode="region";scope="mine";
  document.getElementById("search").value="";
  document.getElementById("sort").value="region";
  document.querySelectorAll(".tf.on").forEach(c=>c.classList.remove("on"));
  syncScope();renderCellar();
}

// ---------------- row rendering ----------------
function row(w){
  const rating=effRating(w);
  const el=document.createElement("article");
  el.className="row t-"+w.type+(w.owned?" owned":"")+(openIds.has(w.id)?" open":"");
  el.dataset.id=w.id;

  const dots=rating?`<span class="rdots">${'<i></i>'.repeat(rating)}</span>`:"";
  const score=(!rating&&w.score)?`<span class="rscore">${esc(w.score)}</span>`:"";
  const sub=[w.w,w.grape].filter(Boolean).map(esc).join(" · ");

  el.innerHTML=
    `<button class="rowhead">
       <span class="stripe"></span>
       <span class="rmain"><span class="rname">${esc(w.n)}</span><span class="rsub">${sub}</span></span>
       <span class="rright"><span class="rprice">${esc(w.price||"")}</span>${dots||score}</span>
     </button>
     <div class="rdetail"></div>`;

  el.querySelector(".rowhead").onclick=()=>{
    const nowOpen=!openIds.has(w.id);
    nowOpen?openIds.add(w.id):openIds.delete(w.id);
    el.classList.toggle("open",nowOpen);
    if(nowOpen)fillDetail(el,w);
  };
  if(openIds.has(w.id))fillDetail(el,w);
  return el;
}

function fillDetail(el,w){
  const d=el.querySelector(".rdetail");
  const rating=effRating(w),note=effNote(w),loc=isLocal(w);
  const tags=[
    w.score?`<span class="dtag score">${esc(w.score)}</span>`:"",
    `<span class="dtag">${esc(regionName(w.region))}</span>`,
    w.owned?`<span class="dtag">im Keller</span>`:"",
    ...(w.pills||[]).map(p=>`<span class="dtag">${esc(p)}</span>`)
  ].join("");
  const pairs=(w.food||[]).map(f=>`<span class="plab">${f} ${esc(FOODLABEL[f]||"")}</span>`).join("");

  d.innerHTML=
    `<div class="desc">${esc(w.desc||"")}</div>
     ${pairs?`<div class="pairs">${pairs}</div>`:""}
     <div class="dmeta">${tags}</div>
     <div class="rate">
       <span class="stars">${[1,2,3,4,5].map(i=>`<button class="st ${i<=rating?"on":""}" data-v="${i}" aria-label="${i} von 5"></button>`).join("")}</span>
       <span class="rlabel">${rating?`${rating}/5${loc?' <span class="loc">· lokal</span>':""}`:"noch nicht bewertet"}${loc?'<button class="revert">zurücksetzen</button>':""}</span>
     </div>
     <div class="note-lbl">Meine Notiz</div>
     <textarea class="note" placeholder="Eigene Verkostungsnotiz…">${esc(note)}</textarea>`;

  d.querySelectorAll(".st").forEach(st=>st.onclick=()=>{
    const v=+st.dataset.v,l=local.get(w.id);
    l.rating=(effRating(w)===v)?0:v;local.set(w.id,l);
    refreshRow(w);
  });
  const rev=d.querySelector(".revert");
  if(rev)rev.onclick=()=>{localStorage.removeItem("wein_"+w.id);refreshRow(w)};
  d.querySelector(".note").oninput=e=>{const l=local.get(w.id);l.note=e.target.value;local.set(w.id,l)};
}

// Re-render just this wine's row(s) in place, keeping scroll position.
function refreshRow(w){
  document.querySelectorAll('.row[data-id="'+CSS.escape(w.id)+'"]').forEach(old=>{
    old.replaceWith(row(w));
  });
}

function group(title,countLabel,wines){
  const frag=document.createDocumentFragment();
  const h=document.createElement("div");h.className="ghead";
  h.innerHTML=`<span class="gn">${esc(title)}</span><span class="gc">${esc(countLabel)}</span>`;
  frag.appendChild(h);
  wines.forEach(w=>frag.appendChild(row(w)));
  return frag;
}

// ---------------- mode 1: food ----------------
function renderFood(){
  const el=document.getElementById("foodResults");el.innerHTML="";
  if(!activeDish){
    el.innerHTML='<div class="hint">Noch kein Gericht gewählt. Tippe oben an, was es heute gibt — oder nimm <b>🍷 Solo</b>, wenn du einfach nur ein Glas trinken willst.</div>';
    return;
  }
  const matches=WINES.filter(w=>(w.food||[]).includes(activeDish));
  if(!matches.length){
    el.innerHTML='<div class="empty"><b>Dazu ist nichts eingetragen.</b><br>Probier ein anderes Gericht.</div>';
    return;
  }
  const byRating=(a,b)=>effRating(b)-effRating(a)||scoreNum(b)-scoreNum(a)||a.priceNum-b.priceNum;
  const mine=matches.filter(w=>w.owned).sort(byRating);
  const rest=matches.filter(w=>!w.owned).sort(byRating);

  if(mine.length)el.appendChild(group("Hast du da",mine.length+(mine.length===1?" Wein":" Weine"),mine));
  else el.insertAdjacentHTML("beforeend",'<div class="hint">Dazu hast du gerade <b>nichts im Keller</b> — hier ist, was passen würde.</div>');
  if(rest.length)el.appendChild(group("Passt auch","nicht im Keller · "+rest.length,rest));
}

// ---------------- mode 2: cellar ----------------
function cellarList(){
  return WINES.filter(w=>{
    if(scope==="mine"&&!w.owned)return false;
    if(activeType.size&&!activeType.has(w.type))return false;
    if(query&&!((w.n+" "+w.w+" "+w.grape).toLowerCase().includes(query)))return false;
    return true;
  });
}
function sortWines(a){
  a=[...a];
  if(sortMode==="myrating")a.sort((x,y)=>effRating(y)-effRating(x)||scoreNum(y)-scoreNum(x));
  else if(sortMode==="score")a.sort((x,y)=>scoreNum(y)-scoreNum(x));
  else if(sortMode==="price")a.sort((x,y)=>x.priceNum-y.priceNum);
  else if(sortMode==="name")a.sort((x,y)=>x.n.localeCompare(y.n));
  else a.sort((x,y)=>regionName(x.region).localeCompare(regionName(y.region))||(y.owned-x.owned)||x.n.localeCompare(y.n));
  return a;
}
function renderCellar(){
  const el=document.getElementById("cellarResults");el.innerHTML="";
  const arr=sortWines(cellarList());
  document.getElementById("count").textContent=arr.length+(arr.length===1?" Wein":" Weine");

  if(!arr.length){
    el.innerHTML='<div class="empty"><b>Kein Wein passt.</b><br>Tippe auf „zurücksetzen".</div>';
    return;
  }
  if(sortMode==="region"){
    const keys=[...new Set(arr.map(w=>w.region))].sort((a,b)=>regionName(a).localeCompare(regionName(b)));
    keys.forEach(k=>{
      const ws=arr.filter(w=>w.region===k);
      el.appendChild(group(regionName(k),regionDO(k)||ws.length+" Weine",ws));
    });
  }else{
    el.appendChild(group(scope==="mine"?"Mein Keller":"Alle Weine",arr.length+" Weine",arr));
  }
}
